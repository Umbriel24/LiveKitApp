services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --bind 0.0.0.0
    environment:
      # Assegna la porta UDP fissa per WebRTC (corrispondente al port mapping)
      UDP_PORT: 7882
      # IP annunciato ai client per i candidati ICE (127.0.0.1 è il loopback di default: localhost su Windows)
      NODE_IP: 127.0.0.1
      # Carica da .env con fallback opzionali per evitare crash se .env manca
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-EXAMPLEAPIRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR}"
    ports:
      - "7880:7880"       # HTTP / WebSocket (Signaling & API)
      - "7881:7881"       # WebRTC over TCP fallback
      - "7882:7882/udp"   # WebRTC over UDP

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5250:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Livekit__InternalUrl: ${LIVEKIT_INTERNAL_URL:-http://livekit:7880} # URL interno, con il doppio underscore
      Livekit__PublicUrl: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      Livekit__ApiKey: ${LIVEKIT_API_KEY}           # stesse chiavi del .env
      Livekit__ApiSecret: ${LIVEKIT_API_SECRET}
      DatabasePassword: ${MSSQL_SA_PASSWORD}
      ConnectionStrings__DefaultConnection: "Server=mssql_db,1433;Database=LiveKitApp;User Id=sa;TrustServerCertificate=True"
    depends_on:
      - livekit
      - mssql_db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5250   # URL pubblico: lo usa il browser, non il container
    ports:
      - "5173:80"
    depends_on:
      - backend

  mssql_db:
    container_name: mssql_container
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PRODUCT_ID:-Developer}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?manca la password MSSQL_SA_PASSWORD}"
    volumes:
      - volumeDatabase:/var/opt/mssql
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    restart: unless-stopped
    
volumes:
  volumeDatabase:
    